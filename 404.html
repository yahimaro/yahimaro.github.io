<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta name="robots" content="noindex, follow">
  <title>ページが見つかりません — Yahimaro Apps</title>
  <meta name="description" content="お探しのページは見つかりませんでした。Yahimaro Apps のトップページや各サービスからお探しください。">
  <script>
    (function () {
      var match = window.location.pathname.match(/^\/invite\/([^/?#]+)/);
      if (!match) return;
      var token = decodeURIComponent(match[1]);
      var url = '/invite/?inviteToken=' + encodeURIComponent(token);
      window.location.replace(url);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FEF3E2;
      color: #1A1A1A;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    section {
      max-width: 480px;
      background: #FFFFFF;
      border: 1px solid #E8D5B5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      color: #854F0B;
      font-size: 22px;
    }
    p {
      margin: 0 0 16px;
      line-height: 1.7;
      color: #6B6B6B;
    }
    a {
      color: #BA7517;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .links a {
      padding: 10px 16px;
      border: 1px solid #E8D5B5;
      border-radius: 10px;
      background: #FFFBF3;
    }
    .links a:hover { background: #FEF3E2; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>ページが見つかりません</h1>
      <p>お探しのページは移動または削除された可能性があります。<br>招待リンクを開いている場合は、自動で案内ページへ移動します。</p>
      <nav class="links">
        <a href="/">Yahimaro Apps トップ</a>
        <a href="/stocker/">Stocker（個人・家庭向け）</a>
        <a href="/stocker-biz/">Stocker Biz（法人・チーム向け）</a>
      </nav>
    </section>
  </main>
</body>
</html>
