<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/images/logo-mark.png">
  <link rel="apple-touch-icon" href="/images/logo-mark.png">
  <title>Stocker 招待リンク</title>
  <script>
    (function () {
      var match = window.location.pathname.match(/^\/invite\/([^/?#]+)/);
      if (!match) return;
      var token = decodeURIComponent(match[1]);
      var url = '/invite/?inviteToken=' + encodeURIComponent(token);
      window.location.replace(url);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FEF3E2;
      color: #1A1A1A;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    section {
      max-width: 480px;
      background: #FFFFFF;
      border: 1px solid #E8D5B5;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      color: #854F0B;
      font-size: 22px;
    }
    p {
      margin: 0 0 16px;
      line-height: 1.7;
      color: #6B6B6B;
    }
    a {
      color: #BA7517;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>ページが見つかりません</h1>
      <p>招待リンクを開いている場合は、自動で案内ページへ移動します。</p>
      <a href="/">Stocker のトップへ戻る</a>
    </section>
  </main>
</body>
</html>
