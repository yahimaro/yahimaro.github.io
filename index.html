<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yahimaro</title>
  <meta name="description" content="yahimaro の公開サイトです。">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --card: #fffdf9;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e7dfd4;
      --accent: #c86b39;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(200, 107, 57, 0.12), transparent 30%),
        linear-gradient(180deg, #fbf8f2 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 60px rgba(31, 41, 55, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.7;
    }

    .muted {
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    code {
      padding: 0.15em 0.4em;
      border-radius: 999px;
      background: #f3ece3;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <main>
    <p class="muted">Public Site</p>
    <h1>yahimaro</h1>
    <p>このサイトは公開用のルートページです。AdMob の <code>app-ads.txt</code> 検証にも利用します。</p>
    <p class="muted">GitHub Pages で配信しています。</p>
    <div class="links">
      <a href="/app-ads.txt">app-ads.txt</a>
      <a href="https://yahimaro.github.io/stocker-site/">Stocker site</a>
      <a href="https://yahimaro.github.io/stocker-site/support">Support</a>
      <a href="https://yahimaro.github.io/stocker-site/privacy">Privacy Policy</a>
    </div>
  </main>
</body>
</html>
