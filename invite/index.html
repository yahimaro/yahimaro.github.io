<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/images/logo-mark.png">
  <link rel="apple-touch-icon" href="/images/logo-mark.png">
  <title>Stocker 招待リンク</title>
  <meta name="description" content="Stocker の家族グループ招待リンクです。">
  <style>
    :root {
      --primary: #EF9F27;
      --dark: #854F0B;
      --cream: #FEF3E2;
      --surface: #FFFFFF;
      --border: #E8D5B5;
      --text: #1A1A1A;
      --muted: #6B6B6B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
    }
    main {
      width: min(100%, 560px);
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      color: var(--dark);
      font-size: clamp(1.5rem, 6vw, 2.1rem);
      line-height: 1.25;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .token-error {
      display: none;
      padding: 12px;
      border-radius: 12px;
      background: #FFF8ED;
      border: 1px solid var(--border);
      color: var(--dark);
      font-weight: 700;
    }
    .token-error.active {
      display: block;
    }
    .help {
      margin-top: 16px;
      font-size: 0.86rem;
    }
  </style>
  <script>
    (function () {
      var APP_STORE_URL = 'https://apps.apple.com/jp/app/homestocker/id6762469486';

      function getInviteToken() {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('inviteToken') || params.get('token');
        return token ? token.trim() : '';
      }

      function openApp(url) {
        window.location.href = url;
      }

      document.addEventListener('DOMContentLoaded', function () {
        var token = getInviteToken();
        var error = document.getElementById('token-error');
        var openButton = document.getElementById('open-app');
        var storeButton = document.getElementById('open-store');

        if (storeButton) storeButton.href = APP_STORE_URL;

        if (!token) {
          if (error) error.classList.add('active');
          if (openButton) openButton.style.display = 'none';
          return;
        }

        var customSchemeUrl = 'stocker://invite/' + encodeURIComponent(token);
        if (openButton) {
          openButton.href = customSchemeUrl;
          openButton.addEventListener('click', function (event) {
            event.preventDefault();
            openApp(customSchemeUrl);
          });
        }

        setTimeout(function () {
          openApp(customSchemeUrl);
        }, 600);
      });
    })();
  </script>
</head>
<body>
  <main>
    <h1>Stocker の家族グループに招待されています</h1>
    <p>アプリが自動で開かない場合は、下のボタンから参加画面を開いてください。</p>
    <div id="token-error" class="token-error">
      招待トークンが見つかりません。招待リンク全体を開き直してください。
    </div>
    <div class="actions">
      <a id="open-app" class="btn btn-primary" href="#">Stockerで開く</a>
      <a id="open-store" class="btn btn-secondary" href="https://apps.apple.com/jp/app/homestocker/id6762469486">アプリを入手</a>
    </div>
    <p class="help">アプリが入っている端末では参加画面へ移動します。未インストールの場合はApp Storeからインストールしてください。</p>
  </main>
</body>
</html>
